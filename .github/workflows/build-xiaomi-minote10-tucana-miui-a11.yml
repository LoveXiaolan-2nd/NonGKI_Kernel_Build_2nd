name: Build Xiaomi Mi Note 10 (tucana) MIUI 12.5 A11

# 目标：小米 Note 10 / CC9 Pro (tucana, SM7150, kernel 4.14)
# ROM：tucana_images_V12.5.9.0.RFDCNXM (MIUI 12.5.9 CN / Android 11)
#
# 用法：把本文件放到你 fork 的 NonGKI_Kernel_Build_2nd 仓库
#   .github/workflows/build-xiaomi-minote10-tucana-miui-a11.yml
# 默认分支 mainline 上，然后 Actions -> Run workflow。
# 产物：tucana-miui_12.5_a11-<时间>-AnyKernel3.zip
#
# 注意：本 ROM 的内核是 4.14.180-perf-g41bf053eccb8，
# 而小米公开的 tucana 源码只有 4.14.117 (tucana-q-oss)。
# /vendor/lib/modules 下的 qca_cld3_wlan.ko + 30 多个 audio_*.ko 的
# vermagic 都是 4.14.180-perf-g41bf053eccb8 ... modversions aarch64。
# 当前版本【不做版本号对齐】，编出来是 4.14.117，厂商 .ko 大概率加载不上，
# WiFi / 音频可能不可用；需要时再加版本对齐那一段。

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "xiaomi_mi_note_10"
  DEVICE_CODENAME : "tucana"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : ""

  KERNEL_SOURCE : "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
  KERNEL_BRANCH : "tucana-q-oss"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/tucana_user_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk, next, bakasu and sukisu

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "miui_12.5_a11"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall" # 这台机器的内核没开 CONFIG_KPROBES，只能 syscall hook

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi Mi Note 10 (tucana) MIUI 12.5 A11
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🔍 Compiler probe
        run: |
          set +e
          cd $GITHUB_WORKSPACE/device_kernel
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
          if [ -f "$GITHUB_WORKSPACE/clang-custom/bin/ld" ]; then
            mv "$GITHUB_WORKSPACE/clang-custom/bin/ld" "$GITHUB_WORKSPACE/clang-custom/bin/ld.proton.host.bak"
            echo "[+] sidelined proton host ld"
          fi

          echo "=== which -a clang / as / ld ==="
          which -a clang
          which -a aarch64-linux-gnu-as as aarch64-linux-gnu-ld
          echo "=== clang --version ==="
          clang --version | head -n 2

          echo "=== make defconfig ==="
          make CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- SUBARCH=arm64 \
               O=out ARCH=arm64 vendor/tucana_user_defconfig > /tmp/def.log 2>&1
          echo "defconfig_exit=$?"
          tail -n 3 /tmp/def.log
          echo "=== stackprotector symbols ==="
          grep -i stackprotector out/.config

          echo "=== spinfo (CC / stackp-flag / cc-option / real compile) ==="
          make CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- SUBARCH=arm64 \
               O=out ARCH=arm64 \
               --eval='spinfo: ; @echo "CC=[$(CC)] FLAG=[$(stackp-flag)] RES=[$(call cc-option,$(stackp-flag))]"; $(CC) $(KBUILD_CPPFLAGS) $(KBUILD_CFLAGS) -fstack-protector-strong -c -o /tmp/sp.o -x c /dev/null && echo SP_OK || echo SP_FAIL' \
               spinfo 2>&1 | tail -n 6

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          set -e
          cd $GITHUB_WORKSPACE/device_kernel

          # proton clang 自带的 host ld 链接不了 HOSTCC 工具，移走用系统 ld
          if [ -f "$GITHUB_WORKSPACE/clang-custom/bin/ld" ]; then
            mv "$GITHUB_WORKSPACE/clang-custom/bin/ld" "$GITHUB_WORKSPACE/clang-custom/bin/ld.proton.host.bak"
            echo "[+] sidelined proton host ld"
          fi

          # 内核版本保持源码原样（4.14.117），不做任何版本号对齐。
          echo "[i] kernel version: $(grep -m1 '^SUBLEVEL' Makefile)"

          # 先关掉 stack protector（cc-option 检测在这套 clang 上会失败），
          # 直接改原始定义，避免追加行被覆盖的问题。
          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' "$DEFCONFIG"
          grep -ni stackprotector "$DEFCONFIG"

          # host 工具用 GCC13 时会因 -fno-common 报 yylloc multiple definition
          grep -q '^HOSTCFLAGS += -fcommon' Makefile || echo 'HOSTCFLAGS += -fcommon' >> Makefile
          tail -n 2 Makefile

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
